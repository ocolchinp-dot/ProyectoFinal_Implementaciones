name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: costa_sur
          POSTGRES_PASSWORD: costa_sur_dev
          POSTGRES_DB: costa_sur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U costa_sur -d costa_sur"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://costa_sur:costa_sur_dev@localhost:5432/costa_sur?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-that-is-not-used-in-production
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      COOKIE_SECURE: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace backend

      - name: Apply migrations
        run: npm run db:migrate:deploy --workspace backend

      - name: Load demo data
        run: npm run db:seed --workspace backend

      - name: Run backend tests
        run: npm test

      - name: Build application
        run: npm run build
