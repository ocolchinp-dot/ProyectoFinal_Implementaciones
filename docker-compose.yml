services:
  postgres:
    image: postgres:16-alpine
    container_name: costa-sur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-costa_sur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-costa_sur_dev}
      POSTGRES_DB: ${POSTGRES_DB:-costa_sur}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - costa_sur_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  costa_sur_pgdata:
